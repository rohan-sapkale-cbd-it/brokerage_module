name: CI

on:
  push:
    branches:
      - main
      - cbd-rohan
      - development
      - developement
      - version-16
  pull_request:
    branches:
      - main
      - cbd-rohan
      - development
      - developement
      - version-16

concurrency:
  group: ci-brokerage_module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Build Production Frontend Assets
        working-directory: frontend
        run: |
          npx vite build

  backend:
    name: Backend Server Tests
    runs-on: ubuntu-24.04
    needs: frontend
    strategy:
      fail-fast: false

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host localhost --user root --password=root"
          --health-interval=5s --health-timeout=2s --health-retries=15
      redis-cache:
        image: redis:6.2-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:6.2-alpine
        ports:
          - 11000:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install bench & Setup test site
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh

      - name: Run Backend Integration & Voucher Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site execute brokerage_module.test_brokerage_backend.run_tests
