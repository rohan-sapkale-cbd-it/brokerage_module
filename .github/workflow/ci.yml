name: CI

on:
  push:
    branches:
      - main
      - cbd-rohan
      - development
      - developement
      - version-16
  pull_request:
    branches:
      - main
      - cbd-rohan
      - development
      - developement
      - version-16

concurrency:
  group: ci-brokerage_module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Build Production Frontend Assets
        working-directory: frontend
        run: |
          npx vite build

  backend:
    name: Backend Server Tests
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Setup Bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install App & Create Test Site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app brokerage_module $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app brokerage_module
        env:
          CI: 'Yes'

      - name: Run Backend Integration & Voucher Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site execute brokerage_module.test_brokerage_backend.run_tests
        env:
          TYPE: server
